[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dust-nicene"
version = "0.3.0"
description = "Dust: a Nicene Creed (381) alignment layer for open language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Daniel Dizon"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dust = "dust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dust = ["data/*.json", "data/*.md", "data/*.npz", "data/*.html", "data/extensions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
